name: Spike portable build

on:
  push:
    branches:
      - spike/portable-build
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_REPO: gelstable/gel
  SOURCE_REF: v7.1

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            image: quay.io/pypa/manylinux_2_28_x86_64
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            image: quay.io/pypa/musllinux_1_2_aarch64
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          path: spike-repo
          persist-credentials: false
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.SOURCE_REF }}
          path: src
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - name: Record runner
        run: |
          nproc; free -h; df -h /
          docker pull -q "${{ matrix.image }}"
          docker inspect --format '{{index .RepoDigests 0}}' "${{ matrix.image }}" | tee image-digest.txt
      - name: Build
        run: |
          mkdir -p out
          cp image-digest.txt out/
          start=$(date +%s)
          docker run --rm \
            -v "$PWD/src:/src" -v "$PWD/spike-repo/spike:/spike:ro" -v "$PWD/out:/out" \
            "${{ matrix.image }}" bash /spike/build.sh "${{ matrix.target }}"
          sudo chown -R "$(id -u):$(id -g)" out
          echo "total $(( $(date +%s) - start ))" >> out/timings.txt
          df -h / | tee -a out/size.txt
      - name: Report
        if: always()
        run: |
          {
            echo "## ${{ matrix.target }}"
            echo '```'
            cat out/identity.txt out/timings.txt out/size.txt 2>/dev/null || true
            echo
            cat out/linkage.txt 2>/dev/null | head -80 || true
            echo
            echo "built from source:"
            cat out/built-from-source.txt 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        if: always()
        with:
          name: reports-${{ matrix.target }}
          path: |
            out/*.txt
            out/*.log
            out/*.json
            out/*.sha256
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: portable-${{ matrix.target }}
          path: out/gel-server-*
          retention-days: 7

  build-macos:
    name: build (aarch64-apple-darwin)
    runs-on: macos-26
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          path: spike-repo
          persist-credentials: false
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.SOURCE_REF }}
          path: src
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - name: Record runner
        run: sysctl -n hw.ncpu hw.memsize; sw_vers; df -h /
      - name: Build
        run: |
          start=$(date +%s)
          bash spike-repo/spike/build-macos.sh src out
          echo "total $(( $(date +%s) - start ))" >> out/timings.txt
      - name: Report
        if: always()
        run: |
          {
            echo "## aarch64-apple-darwin"
            echo '```'
            cat out/identity.txt out/timings.txt out/size.txt 2>/dev/null || true
            echo
            head -80 out/linkage.txt 2>/dev/null || true
            echo
            echo "built from source:"
            cat out/built-from-source.txt 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        if: always()
        with:
          name: reports-aarch64-apple-darwin
          path: |
            out/*.txt
            out/*.log
            out/*.json
            out/*.sha256
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: portable-aarch64-apple-darwin
          path: out/gel-server-*
          retention-days: 7

  smoke-macos:
    name: smoke (aarch64-apple-darwin)
    needs: build-macos
    runs-on: macos-26
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: portable-aarch64-apple-darwin
          path: dist
      - run: |
          dest="$HOME/some/other/place"
          mkdir -p "$dest"
          tar -xzf dist/gel-server-aarch64-apple-darwin.tar.gz -C "$dest"
          server=$(echo "$dest"/gel-server-*/bin/gel-server)
          python=$(dirname "$server")/python3
          "$server" --version
          "$server" --data-dir "$RUNNER_TEMP/data" --runstate-dir "$RUNNER_TEMP" \
            --tls-cert-mode generate_self_signed --port 5656 --bind-address 127.0.0.1 \
            --bootstrap-command "ALTER ROLE admin { SET password := 'spike' }" \
            > server.log 2>&1 &
          pid=$!
          for i in $(seq 120); do
            if "$python" -I -c "
          import gel
          c = gel.create_client(host='127.0.0.1', port=5656, user='admin',
                                password='spike', tls_security='insecure', database='main')
          print('query result:', c.query_single('select 1 + 1'))
          " 2>/dev/null; then kill $pid; exit 0; fi
            kill -0 $pid || break
            sleep 5
          done
          tail -50 server.log
          exit 1

  smoke:
    name: smoke (${{ matrix.target }} on ${{ matrix.image }})
    needs: build
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            image: debian:12
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            image: rockylinux:9
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            image: ubuntu:20.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            image: alpine:3.20
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: portable-${{ matrix.target }}
          path: dist
      - run: |
          docker run --rm -v "$PWD/dist:/dist:ro" -v "$PWD/spike:/spike:ro" \
            "${{ matrix.image }}" sh /spike/smoke.sh "/dist/gel-server-${{ matrix.target }}.tar.gz"

  compare:
    name: compare with v7.1 (${{ matrix.target }})
    needs: [build, build-macos]
    if: always() && !cancelled()
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-unknown-linux-gnu, aarch64-unknown-linux-musl, aarch64-apple-darwin]
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: reports-${{ matrix.target }}
          path: new
      - env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ matrix.target }}
        run: |
          gh release download v7.1 -R gelstable/gel -p "gel-server-$TARGET.tar.gz" -D old
          tar -tzf "old/gel-server-$TARGET.tar.gz" | sed -E 's|^(\./)?gel-server-[^/]*/?||' | grep -v '^$' | sort > old.txt
          grep -v '^$' new/files.txt | sort > new.txt
          # Ignore bytecode and dist-info noise when grouping.
          norm() { sed -E 's|__pycache__/.*||; s|[^/]*\.dist-info/.*|DIST-INFO|' "$1" | sort -u; }
          group() { awk -F/ '{ n = (NF < 3 ? NF : 3); p = $1; for (i = 2; i <= n; i++) p = p "/" $i; print p }' | sort | uniq -c | sort -rn; }
          comm -23 <(norm old.txt) <(norm new.txt) > only-old.txt
          comm -13 <(norm old.txt) <(norm new.txt) > only-new.txt
          {
            echo "## $TARGET vs v7.1"
            echo "files: old $(wc -l < old.txt), new $(wc -l < new.txt)"
            echo "### only in v7.1 (grouped)"; echo '```'; group < only-old.txt | head -60; echo '```'
            echo "### only in new build (grouped)"; echo '```'; group < only-new.txt | head -60; echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: compare-${{ matrix.target }}
          path: "*.txt"

  native:
    name: native packages from the new archive
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          repository: gelstable/gel
          ref: package-apt-rpm
          persist-credentials: false
      - uses: gelstable/gel-registry/.github/actions/setup-nfpm@6d3215a7bf494fed5ea0ccd670f7e765a2b70aac
      - run: sudo apt-get update && sudo apt-get install -y zstd rpm
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: portable-x86_64-unknown-linux-gnu
          path: dist/source
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/native_packages.py --archive dist/source/gel-server-x86_64-unknown-linux-gnu.tar.zst --revision 1 --arch x86_64 --out dist/native
          python3 scripts/native_packages.py --fetch-cli --arch x86_64 --out dist/cli
          slot=$(jq -r .slot dist/native/build-info-x86_64.json)
          docker run --rm -v "$PWD/dist/native:/packages:ro" -v "$PWD/dist/cli:/cli:ro" -v "$PWD/native-packaging:/test:ro" debian:12 bash /test/install-test.sh deb amd64 "$slot"
          docker run --rm -v "$PWD/dist/native:/packages:ro" -v "$PWD/dist/cli:/cli:ro" -v "$PWD/native-packaging:/test:ro" rockylinux:9 bash /test/install-test.sh rpm x86_64 "$slot"
