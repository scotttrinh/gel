name: Spike gel server install

# Installs the archives from a finished spike-portable run with the
# released gel CLI, through a local package root.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: spike-portable run whose archives to install
        required: true

permissions:
  contents: read
  actions: read

env:
  CLI_URL: https://github.com/gelstable/gel-cli/releases/download/v7.10.2

jobs:
  install:
    name: gel server install (${{ matrix.target }} on ${{ matrix.image || matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            image: debian:12
            cli: x86_64-unknown-linux-musl
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            image: alpine:3.20
            cli: aarch64-unknown-linux-musl
          - target: aarch64-apple-darwin
            runner: macos-26
            cli: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: portable-${{ matrix.target }}
          path: dist
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - run: curl -sSfL -o gel "$CLI_URL/gel-cli-${{ matrix.cli }}"
      - if: matrix.image
        run: |
          docker run --rm -v "$PWD:/w:ro" "${{ matrix.image }}" \
            sh /w/spike/cli-install.sh /w/dist "${{ matrix.target }}" /w/gel
      - if: ${{ !matrix.image }}
        run: sh spike/cli-install.sh dist "${{ matrix.target }}" gel
